[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "investment-os"
version = "0.2.0"
description = "Evidence-first personal investment research pipeline for agents and humans."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Madkyotiger"}]
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
market = [
  "yfinance>=0.2.40",
]
global-research = [
  "yfinance>=0.2.40",
  "openbb>=4.7.2",
  "financetoolkit>=2.1.3",
  "edgartools>=5.40.1",
]
china = [
  "akshare>=1.18.64",
  "tushare>=1.4.29",
]
dev = [
  "build>=1.2",
  "pytest>=8.2",
  "ruff>=0.12",
]

[project.urls]
Repository = "https://github.com/Madkyotiger/investment-os"
Issues = "https://github.com/Madkyotiger/investment-os/issues"

[project.scripts]
investment-os = "investment_os.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
